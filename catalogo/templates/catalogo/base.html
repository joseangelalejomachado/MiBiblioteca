{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/biblioteca.css' %}">
    <title>{% block page_title %}MiBiblioteca{% endblock %}</title>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="{% url 'lista_libros' %}">MiBiblioteca</a>
            <nav class="site-nav">
                <a href="{% url 'lista_libros' %}"{% if request.resolver_match.url_name == 'lista_libros' %} class="activo" aria-current="page"{% endif %}>Catálogo</a>
                <a href="{% url 'principal' %}"{% if request.resolver_match.url_name == 'principal' %} class="activo" aria-current="page"{% endif %}>Resumen</a>
            </nav>
        </div>
    </header>
    <main class="container main-content">
        {% block contenido %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">MiBiblioteca · Práctica de Django · 2º DAW</div>
    </footer>
</body>

</html>
